[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pbit1"
version = "0.1.0a2.dev0"
description = "One programmable p-bit per neural parameter: THRML integration and audited research"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Omar Ramadan"}]
dependencies = ["numpy>=2.0"]
keywords = ["pbit", "pbit1", "fp1", "extropic", "thrml", "stochastic-computing", "probabilistic-computing", "neural-networks", "model-compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
thrml = [
  "jax==0.12.0.1", "jaxlib==0.12.0.1", "equinox==0.13.8", "jaxtyping==0.3.11",
  "thrml @ git+https://github.com/extropic-ai/thrml.git@2d54cd8404df85bb65703d7e8b4e84e48c1b72a9",
]
dev = ["pytest>=8", "build>=1", "matplotlib>=3.10"]

[project.urls]
Homepage = "https://github.com/oramada/pbit1"
Documentation = "https://github.com/oramada/pbit1/blob/main/docs/EXTROPIC_BRIEF.md"
Experiments = "https://github.com/oramada/pbit1-extropic"
Issues = "https://github.com/oramada/pbit1/issues"

[project.scripts]
pbit1 = "pbit1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
