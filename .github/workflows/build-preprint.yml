name: Build revised preprint PDF
on:
  push:
    branches:
      - paper/preprint-reframe-classic-structure
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-bibtex-extra poppler-utils
      - name: Compile manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: PBit1-revised-preprint-PDF
          path: paper/main.pdf
          if-no-files-found: error
